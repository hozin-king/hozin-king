name: Update Featured Projects

on:
  schedule:
    - cron: '0 2 * * *'   # 09:00 WIB
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-projects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Featured Projects in README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'EOF'
          import json, os, re, urllib.request

          token = os.environ["GH_TOKEN"]
          req = urllib.request.Request(
              "https://api.github.com/users/hozin-king/repos?per_page=100&sort=updated",
              headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json", "User-Agent": "hozin-king-profile"},
          )
          repos = json.load(urllib.request.urlopen(req))
          rows = []
          for r in repos:
              if r.get("fork") or r.get("archived") or r["name"] == "hozin-king":
                  continue
              name = r["name"]
              desc = (r.get("description") or "").strip() or "—"
              desc = desc.replace("|", "/").replace("\n", " ")
              stars = r.get("stargazers_count", 0)
              rows.append(f"| **[{name}]({r['html_url']})** | {desc} | ⭐ {stars} |")
              if len(rows) >= 8:
                  break
          table = "| Project | Description | ⭐ |\n|---|---|---|\n" + "\n".join(rows)
          with open("README.md", encoding="utf-8") as f:
              readme = f.read()
          new = re.sub(
              r"(<!-- PROJECTS:START -->).*?(<!-- PROJECTS:END -->)",
              lambda m: m.group(1) + "\n" + table + "\n" + m.group(2),
              readme,
              flags=re.S,
          )
          if new != readme:
              with open("README.md", "w", encoding="utf-8") as f:
                  f.write(new)
              print("README updated")
          else:
              print("No changes")
          EOF
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh featured projects" || exit 0
          git push
