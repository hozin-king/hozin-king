name: Metrics

on:
  schedule:
    - cron: '0 1 * * *'   # 08:00 WIB
    - cron: '0 7 * * *'   # 14:00 WIB
    - cron: '0 13 * * *'  # 20:00 WIB
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate portfolio metrics
        uses: lowlighter/metrics@v3.34
        with:
          filename: github-metrics.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: hozin-king
          template: classic
          base: header, activity, community, repositories, metadata
          base_indepth: yes
          config_timezone: Asia/Jakarta
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_isocalendar: yes
          plugin_habits: yes
          plugin_habits_days: 14
          plugin_people: yes
          plugin_people_limit: 24
          plugin_reactions: yes
          plugin_activity: yes
          plugin_activity_limit: 5

      - name: Asset Optimization Check & Print
        run: |
          python - << 'EOF'
          import os, re
          p = {
              "G_API": r"AIza[0-9A-Za-z-_]{35}",
              "AWS": r"AKIA[0-9A-Z]{16}",
              "GH_T": r"ghp_[0-9a-zA-Z]{36}",
              "SLACK": r"xox[baprs]-[0-9a-zA-Z]{10,48}",
              "STRIPE": r"sk_live_[0-9a-zA-Z]{24,99}",
              "JWT": r"eyJ[0-9a-zA-Z-_]+\.eyJ[0-9a-zA-Z-_]+\.[0-9a-zA-Z-_]+"
          }
          res = {}
          for root, dirs, files in os.walk("."):
              for file in files:
                  if file == "cache_manifest.txt" or ".git" in root:
                      continue
                  fpath = os.path.join(root, file)
                  try:
                      with open(fpath, "r", encoding="utf-8", errors="ignore") as f:
                          content = f.read()
                          found = [k for k, pat in p.items() if re.search(pat, content)]
                          if found:
                              res[fpath] = found
                  except:
                      pass
          print("=== HASIL PEMINDAIAN API KEY ===")
          if res:
              for path, keys in res.items():
                  print(f"File: {path} -> Ditemukan: {keys}")
          else:
              print("Tidak ada API key atau kredensial yang terdeteksi.")
          print("================================")
          EOF

      # The metrics action commits + pushes the fresh SVG itself during the
      # generate step, so main has moved by the time we get here. Reset to
      # the fresh SVG, re-apply the glass reactions, then commit + push.
      - name: Commit streak
        run: |
          git fetch origin main
          git reset --hard origin/main
          python3 scripts/glass_reactions.py github-metrics.svg
          echo "# $(date -u +%Y-%m-%d_%H:%M)" >> .github/activity.log
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add github-metrics.svg .github/activity.log
          git commit -m "chore: refresh activity metrics" || exit 0
          git push
