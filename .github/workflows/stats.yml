name: Profile Stats Cards

# Self-hosted replacement for github-readme-stats.vercel.app (rate-limited).
# Generates stats.svg + top-langs.svg from the GitHub API and commits them,
# so the README images are served from this repo (GitHub's own domain).
on:
  schedule:
    - cron: "0 19 * * *"   # 02:00 WIB
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate stats cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/gen_stats.py
      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.svg top-langs.svg
          git commit -m "chore: refresh profile stats cards" || exit 0
          git push
